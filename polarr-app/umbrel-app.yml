manifestVersion: 1
id: polarr-app
category: media
name: Polarr
version: "0.6.40"
tagline: Discover, request, and stream your homeserver music
icon: https://raw.githubusercontent.com/KevinGuest/polarr-app/main/polarr-app/icon.png
port: 3647
description: >-
  Polarr is a self-hosted music hub for umbrelOS. Point it at Lidarr (the same
  way Seerr connects to Sonarr and Radarr), request missing albums, fill gaps
  with an optional Downtify-style fallback downloader, and stream the catalog
  from the browser.


  🛠️ SET-UP INSTRUCTIONS


  After install, open Polarr and complete the first-run wizard in your browser.


  - Create an admin account for the Polarr UI


  - Add your Lidarr URL and API key (Umbrel users can try
  http://lidarr_server_1:8686 or your device IP with port 8686)


  - Optionally enable fallback acquisition for titles Lidarr cannot fetch


  - Scan your music folder and start listening


  Polarr does not ship Lidarr itself; install Lidarr from the Umbrel App Store
  first if you want automated *arr-style acquisition.
releaseNotes: |-
  - **Faster YouTube playback** — cold-start streams resolve in one shot instead of a long search ladder
  - **Smarter library matching** — download filenames become real titles; collab tracks play from disk
  - **Taste autoplay** — radio prefers artists you actually listen to, with a small novelty slice
  - **Player covers** — expanded player / Lock Screen / Dynamic Island art fixed (iOS build 640)
  - **Security harden** — tighter API auth, playlist import allowlist, safer music path serving
  - **Desktop app** — updated to v0.2.22 (Windows volume mixer shows as Polarr)

developer: Kevin Guest
website: https://github.com/KevinGuest/polarr-app
submitter: KevinGuest
submission: https://github.com/KevinGuest/polarr-app
repo: https://github.com/KevinGuest/polarr
support: https://github.com/KevinGuest/polarr/issues
gallery: []
dependencies:
  - lidarr
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
