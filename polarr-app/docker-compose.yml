version: "3.7"

services:
  app_proxy:
    environment:
      # Umbrel names containers: <app-id>_<service>_1
      APP_HOST: polarr-app_web_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: "/api/*"

  web:
    # Digest pinned after GHCR publish — bump both on release.
    image: ghcr.io/kevinguest/polarr-app:0.2.0@sha256:588e389e573d6938b1e339b4862becce0a78986019f7f55bcb850430a588fd2b
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      - POLARR_DATA_DIR=/data
      - POLARR_MUSIC_DIR=/music
      - POLARR_DOWNLOADS_DIR=/music/downloads
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - POLARR_APP_VERSION=0.2.0
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/data/storage/downloads/music:/music
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
